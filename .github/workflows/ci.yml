name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No `submodules: recursive` here: this job only builds the React client
      # and packages the wheel, so idtrackerai/flyhostel (and their private
      # nested submodules) are never needed.
      - uses: actions/checkout@v4

      - name: Check out the client submodule only
        run: git submodule update --init idtrackerai-validator-client

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: idtrackerai-validator-client/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build the React client
        env:
            CI: false # TODO set to true when I fix the warnings
        run: |
          npm --prefix idtrackerai-validator-client ci
          npm --prefix idtrackerai-validator-client run build
          rm -rf idtrackerai_validator_server/frontend
          cp -r idtrackerai-validator-client/build idtrackerai_validator_server/frontend
          test -f idtrackerai_validator_server/frontend/index.html

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the frontend is inside both artifacts
        run: |
          set -euo pipefail

          echo "--- wheel ---"
          wheel=$(ls dist/*.whl)
          unzip -l "$wheel" > /tmp/wheel-list.txt
          grep -q 'idtrackerai_validator_server/frontend/index.html' /tmp/wheel-list.txt \
            || { echo "wheel is missing index.html"; exit 1; }
          n=$(grep -c 'frontend/static/' /tmp/wheel-list.txt || true)
          echo "static assets in wheel: $n"
          test "$n" -gt 0 || { echo "wheel has no static assets"; exit 1; }

          echo "--- sdist ---"
          sdist=$(ls dist/*.tar.gz)
          tar -tzf "$sdist" > /tmp/sdist-list.txt
          grep -q 'idtrackerai_validator_server/frontend/index.html' /tmp/sdist-list.txt \
            || { echo "sdist is missing index.html"; exit 1; }
          echo "static assets in sdist: $(grep -c 'frontend/static/' /tmp/sdist-list.txt || true)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke-test:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install runtime dependencies from GitHub
        env:
          GH_PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${GH_PAT}" ]; then
            echo "SUBMODULE_PAT is not set. Add it under"
            echo "Settings > Secrets and variables > Actions."
            exit 1
          fi

          # flyhostel and idtrackerai pull in private nested submodules
          # (flyhostel-modelling, zeitgeber, googleapi, flyhostel-validation).
          # This rewrite lets git authenticate to all of them with the token.
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "git@github.com:"

          python -m venv /tmp/testenv
          /tmp/testenv/bin/pip install --upgrade pip

          # idtrackerai[gpu] would pull the CUDA build of torch from PyPI (~3GB,
          # plus a dozen nvidia-* packages). The probes below never run
          # inference, so install the CPU wheels FIRST — pip leaves an already
          # satisfied requirement alone, so the later install won't replace them.
          /tmp/testenv/bin/pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu

          # opencv-python<4 (required by idtrackerai) is built against the
          # numpy 1.x ABI and cannot load under numpy 2.
          /tmp/testenv/bin/pip install "numpy<2"

          /tmp/testenv/bin/pip install "git+https://github.com/shaliulab/flyhostel"

      - name: Install the wheel
        run: /tmp/testenv/bin/pip install dist/*.whl

      - name: Check the environment is consistent
        run: |
          /tmp/testenv/bin/pip list | grep -iE "numpy|opencv|torch" || true
          # Catches incompatible metadata before the server tries to start,
          # which gives a clearer failure than an ABI error deep in a traceback.
          /tmp/testenv/bin/pip check

      - name: Serve and probe
        run: |
          set -euo pipefail

          # Empty data directory: the server must start and answer even with
          # no experiments, which is the state a new user is in.
          mkdir -p /tmp/videos
          : > /tmp/videos/index.txt
          export FLYHOSTEL_VIDEOS=/tmp/videos

          cd /tmp        # away from any source tree
          /tmp/testenv/bin/start-idtrackerai-validator-server \
            --port 5000 --no-browser > /tmp/server.log 2>&1 &
          server_pid=$!

          # Fail as soon as the process dies, rather than waiting out the full
          # 30s and then reporting an opaque "connection refused".
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:5000/ && break
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "server exited during startup:"
              cat /tmp/server.log
              exit 1
            fi
            sleep 1
          done

          echo "--- index ---"
          curl -sf http://localhost:5000/ | head -c 100
          echo

          echo "--- main bundle ---"
          js=$(curl -sf http://localhost:5000/ | grep -o '/static/js/main\.[^"]*\.js' | head -1)
          test -n "$js" || { echo "no bundle referenced in index.html"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:5000$js")
          test "$code" = "200" || { echo "bundle returned $code"; exit 1; }

          echo "--- SPA catch-all, one segment ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/settings)
          test "$code" = "200" || { echo "one-segment route returned $code"; exit 1; }

          echo "--- SPA catch-all, deep path ---"
          # Regression guard: Flask's built-in static rule used to shadow the
          # catch-all here, and a one-segment path alone would not have caught it.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 http://localhost:5000/experiment/FlyHostel1/3X/2026-08-19_14-00-00/frame/900)
          test "$code" = "200" || { echo "deep route returned $code"; exit 1; }

          echo "--- unknown API route must 404, not serve HTML ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/api/nonexistent)
          test "$code" = "404" || { echo "unknown API route returned $code"; exit 1; }

          echo "all probes passed"

      - name: Server log
        if: always()
        run: cat /tmp/server.log || true